[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shared"
version = "0.1.0"
description = "Shared infrastructure package for backend services"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*"]
