services:
  rag-service:
    build:
      context: ../..          # backend/ root (so shared/ is accessible)
      dockerfile: services/rag-service/Dockerfile
    container_name: rag-service
    ports:
      - "${RAG_SERVICE_PORT:-8001}:8001"
    env_file:
      - ../../.env
    volumes:
      - ./app:/workspace/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload

  rag-celery-worker:
    build:
      context: ../..
      dockerfile: services/rag-service/Dockerfile.worker
    container_name: rag-celery-worker
    env_file:
      - ../../.env
    environment:
      - DB_HOST=postgres
      - DB_DATABASE=${RAG_DB_DATABASE:-rag_db}
      - DB_USERNAME=${RAG_DB_USERNAME:-rag_user}
      - DB_PASSWORD=${RAG_DB_PASSWORD:-rag_password}
      - QDRANT_HOST=qdrant
      - REDIS_HOST=redis
      - MINIO_ENDPOINT=minio:9000
    depends_on:
      - redis

networks:
  default:
    name: keycloak_network
    external: true
