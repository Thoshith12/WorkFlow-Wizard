services:
  rag-service:
    build:
      context: ../..          # backend/ root (so shared/ is accessible)
      dockerfile: services/rag-service/Dockerfile
    container_name: rag-service
    ports:
      - "${RAG_SERVICE_PORT:-8001}:8001"
    env_file:
      - ../../.env
    volumes:
      - ./app:/workspace/app
      # HuggingFace model disk cache — shared with the Celery worker so models
      # are downloaded once and reused across container restarts.
      - hf_model_cache:/workspace/.cache/huggingface
    environment:
      - HF_HOME=/workspace/.cache/huggingface
      - SENTENCE_TRANSFORMERS_HOME=/workspace/.cache/huggingface/sentence-transformers
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload

  rag-celery-worker:
    build:
      context: ../..
      dockerfile: services/rag-service/Dockerfile.worker
    container_name: rag-celery-worker
    env_file:
      - ../../.env
    environment:
      - DB_HOST=postgres
      - DB_DATABASE=${RAG_DB_DATABASE:-rag_db}
      - DB_USERNAME=${RAG_DB_USERNAME:-rag_user}
      - DB_PASSWORD=${RAG_DB_PASSWORD:-rag_password}
      - QDRANT_HOST=qdrant
      - REDIS_HOST=redis
      - MINIO_ENDPOINT=minio:9000
      # HuggingFace cache path — models are loaded on-demand and unloaded after each job.
      - HF_HOME=/workspace/.cache/huggingface
      - SENTENCE_TRANSFORMERS_HOME=/workspace/.cache/huggingface/sentence-transformers
      # Agentic chunking — Claude Haiku 4.5
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      # Shared HuggingFace disk cache between API service and Celery workers.
      # On first download the model files are written here; subsequent runs skip the download.
      - hf_model_cache:/workspace/.cache/huggingface
    depends_on:
      - redis

networks:
  default:
    name: keycloak_network
    external: true

volumes:
  # Named volume for HuggingFace model disk cache.
  # Models are downloaded once and persisted here across container restarts.
  # Memory (VRAM/RAM) is managed separately: models are loaded on demand
  # and explicitly unloaded after each data connector's chunks are processed.
  hf_model_cache:
    driver: local
