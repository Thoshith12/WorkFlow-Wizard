# app/config/embedding_models.yaml
#
# Embedding model registry for the RAG chunking pipeline.
#
# LANGUAGE CODES: All language codes are ISO 639-1 two-letter codes,
# matching the exact output of FastText lid.176 language detection.
# Example: FastText returns "__label__hi" → strip prefix → "hi" (Hindi).
#
# WILDCARD: A model with languages: ["*"] supports all 176 languages
# in the FastText lid.176 corpus.
#
# MODEL SIZE CONSTRAINT: All models listed here are kept under 1 GB
# in their float32 weights to ensure fast on-demand load/unload cycles.

# ── Language Map ──────────────────────────────────────────────────────────────
# ISO 639-1 → human-readable name. Used in error messages and logging.
# Keeps consistent with FastText lid.176 language codes.
